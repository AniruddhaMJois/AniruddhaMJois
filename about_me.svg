<svg width="650" height="230" viewBox="0 0 650 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #1a1b27; rx: 15px; stroke: #38BDAE; stroke-width: 1px; }
      .name { font: 600 22px 'Segoe UI', system-ui, sans-serif; fill: #70A5FD; }
      .subtitle { font: 400 14px 'Segoe UI', system-ui, sans-serif; fill: #a9b1d6; }
      .item { font: 400 14px 'Segoe UI', system-ui, sans-serif; fill: #c0caf5; }
      .highlight { font-weight: 600; fill: #BF91F3; }
      .icon { font-size: 14px; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="650" height="230" />
  
  <!-- Profile Picture / Circle -->
  <g transform="translate(40, 40)">
    <circle cx="30" cy="30" r="30" fill="#2a2e45" stroke="#38BDAE" stroke-width="2" />
    <!-- Initials inside the circle -->
    <text x="30" y="36" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="20" fill="#70A5FD" text-anchor="middle">AMJ</text>
  </g>
  
  <!-- Header Text -->
  <text x="120" y="58" class="name">Aniruddha M Jois</text>
  <text x="120" y="82" class="subtitle">B.E. Computer Science Engineering (Class of 2029)</text>
  <text x="120" y="102" class="subtitle">Vidya Vardhaka College of Engineering</text>

  <!-- Divider -->
  <line x1="40" y1="120" x2="610" y2="120" stroke="#a9b1d6" stroke-dasharray="2" opacity="0.2" />

  <!-- Content / Info -->
  <text x="40" y="150" class="item"><tspan class="icon">💻</tspan> <tspan class="highlight">Primary Stack: </tspan> Java, C/C++, Python</text>
  <text x="40" y="175" class="item"><tspan class="icon">⚙️</tspan> <tspan class="highlight">Secondary Stack: </tspan> HTML/CSS, ESP32, Arduino Uno</text>
  
  <text x="340" y="150" class="item"><tspan class="icon">🎯</tspan> <tspan class="highlight">Domains: </tspan> IoT, Cybersecurity, Full-Stack</text>
  <text x="340" y="175" class="item"><tspan class="icon">🎵</tspan> <tspan class="highlight">Interests: </tspan> Tabla, Sanskrit, Cricket</text>

</svg>
